        run: |
          if [ -f settings.gradle ]; then
            echo "專案原始碼已存在，略過展開"
            exit 0
          fi
          printf '%s' "$PAYLOAD" | base64 -d | tar xzf -
          echo "展開完成："
          find . -name '*.java' -o -name '*.gradle' | sort

      - name: 決定網址
        id: url
        run: |
          URL="${{ github.event.inputs.app_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.TPX_URL }}"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::warning::沒有設定 TPX_URL，App 開啟時會跳出對話框要你手動輸入網址"
          else
            echo "使用網址：$URL"
          fi

      - name: 產生 App 圖示
        run: |
          set -e
          RES=app/src/main/res
          SRC=""
          URL="${{ steps.url.outputs.url }}"

          # 先試著從你的網站抓現成圖示
          if [ -n "$URL" ]; then
            BASE="${URL%/}"
            for CAND in icons/icon-512.png icons/icon-512-maskable.png icons/icon-192.png; do
              if curl -fsSL --max-time 20 "$BASE/$CAND" -o /tmp/src.png; then
                SRC=/tmp/src.png
                echo "取得網站圖示：$CAND"
                break
              fi
            done
          fi

          # 抓不到就自己畫一個
          if [ -z "$SRC" ]; then
            echo "抓不到網站圖示，改用內建樣式"
            convert -size 512x512 xc:'#0D0D0D' \
                    -fill '#C45C1A' -draw 'roundrectangle 40,40 472,472 90,90' \
                    -gravity center -fill white -pointsize 240 -annotate +0+0 '金' \
                    /tmp/src.png
            SRC=/tmp/src.png
          fi

          for ENTRY in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            D="${ENTRY%%:*}"
            REST="${ENTRY#*:}"
            S="${REST%%:*}"
            F="${REST#*:}"
            OUT="$RES/mipmap-$D"
            mkdir -p "$OUT"

            convert "$SRC" -resize "${S}x${S}" "$OUT/ic_launcher.png"
            cp "$OUT/ic_launcher.png" "$OUT/ic_launcher_round.png"

            INNER=$(( F * 62 / 100 ))
            convert "$SRC" -resize "${INNER}x${INNER}" \
                    -background none -gravity center -extent "${F}x${F}" \
                    "$OUT/ic_launcher_foreground.png"
          done
          echo "圖示產生完成"

      - name: 編譯 APK
        run: |
          ARGS=""
          if [ -n "${{ steps.url.outputs.url }}" ]; then
            ARGS="-PtpxUrl=${{ steps.url.outputs.url }}"
          fi
          gradle assembleDebug $ARGS --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/TPX1000-${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: TPX1000-apk
          path: dist/*.apk
          retention-days: 30

      - name: 把原始碼存回 repo（只做一次）
        continue-on-error: true
        run: |
          if git ls-files --error-unmatch settings.gradle >/dev/null 2>&1; then
            echo "原始碼已在版本庫中，略過"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf app/build .gradle dist
          git add -A app settings.gradle build.gradle gradle.properties .gitignore
          git commit -m "自動展開 Android 專案原始碼" || exit 0
          git push
