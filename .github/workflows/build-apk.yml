        run: |
          if [ -f settings.gradle ]; then
            echo "專案原始碼已存在，略過展開"
            exit 0
          fi
          printf '%s' "$PAYLOAD" | base64 -d | tar xzf -
          echo "展開完成："
          find . -name '*.java' -o -name '*.gradle' | sort

      - name: 決定網址
        id: url
        run: |
          URL="${{ github.event.inputs.app_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.TPX_URL }}"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::warning::沒有設定 TPX_URL，App 開啟時會跳出對話框要你手動輸入網址"
          else
            echo "使用網址：$URL"
          fi

      - name: 產生 App 圖示
        env:
          TPX_URL: ${{ steps.url.outputs.url }}
          ICON_SCRIPT: |
            import os, io, urllib.request
            from PIL import Image, ImageDraw
            
            url = os.environ.get("TPX_URL", "").rstrip("/")
            src = None
            if url:
                for cand in ["icons/icon-512.png", "icons/icon-512-maskable.png", "icons/icon-192.png"]:
                    try:
                        with urllib.request.urlopen(url + "/" + cand, timeout=20) as r:
                            src = Image.open(io.BytesIO(r.read())).convert("RGBA")
                        print("取得網站圖示:", cand)
                        break
                    except Exception:
                        pass
            if src is None:
                print("抓不到網站圖示，改用內建樣式")
                src = Image.new("RGBA", (512, 512), (13, 13, 13, 255))
                ImageDraw.Draw(src).rounded_rectangle([40, 40, 472, 472], 90, fill=(196, 92, 26, 255))
            
            res = "app/src/main/res"
            for d, s, f in [("mdpi", 48, 108), ("hdpi", 72, 162), ("xhdpi", 96, 216),
                            ("xxhdpi", 144, 324), ("xxxhdpi", 192, 432)]:
                out = res + "/mipmap-" + d
                os.makedirs(out, exist_ok=True)
                img = src.resize((s, s), Image.LANCZOS)
                img.save(out + "/ic_launcher.png")
                mask = Image.new("L", (s * 4, s * 4), 0)
                ImageDraw.Draw(mask).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
                rnd = img.copy()
                rnd.putalpha(mask.resize((s, s), Image.LANCZOS))
                rnd.save(out + "/ic_launcher_round.png")
                inner = int(f * 0.62)
                canvas = Image.new("RGBA", (f, f), (0, 0, 0, 0))
                logo = src.resize((inner, inner), Image.LANCZOS)
                canvas.paste(logo, ((f - inner) // 2, (f - inner) // 2), logo)
                canvas.save(out + "/ic_launcher_foreground.png")
            print("圖示產生完成")
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          printf '%s' "$ICON_SCRIPT" > /tmp/make_icons.py
          python3 /tmp/make_icons.py

      - name: 編譯 APK
        run: |
          ARGS=""
          if [ -n "${{ steps.url.outputs.url }}" ]; then
            ARGS="-PtpxUrl=${{ steps.url.outputs.url }}"
          fi
          gradle assembleDebug $ARGS --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TPX1000-${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: TPX1000-apk
          path: dist/*.apk
          retention-days: 30

      - name: 把原始碼存回 repo（只做一次）
        continue-on-error: true
        run: |
          if git ls-files --error-unmatch settings.gradle > /dev/null 2>&1; then
            echo "原始碼已在版本庫中，略過"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf app/build .gradle dist
          git add -A app settings.gradle build.gradle gradle.properties .gitignore
          git commit -m "自動展開 Android 專案原始碼" || exit 0
          git push
