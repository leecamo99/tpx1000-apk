name: Build APK

# ============================================================
#  TPX1000 Android 殼 — 一次貼上版
#
#  整個 Android 專案壓縮在下面的 PAYLOAD 裡，你只需要這一個檔案。
#  第一次跑完後，原始碼會自動 commit 回這個 repo。
#
#  記得先設 repo variable：
#  Settings → Secrets and variables → Actions → Variables → TPX_URL
# ============================================================

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "TPX1000 網址（留空則用 repo variable TPX_URL）"
        required: false
        default: ""
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 確認 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 展開專案原始碼
